<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធបញ្ចូលទិន្នន័យសិស្ស - ខេត្តកំពង់ចាម</title>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --success-hover: #059669;
            --update-color: #f59e0b;
            --update-hover: #d97706;
            --delete-color: #ef4444;
            --delete-hover: #dc2626;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --focus-ring: rgba(79, 70, 229, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Battambang', serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 10px; }
        .container { width: 100%; max-width: 900px; margin: 0 auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); overflow: hidden; }
        .form-header { background: linear-gradient(135deg, #4f46e5, #6366f1); color: #ffffff; padding: 15px; text-align: center; }
        .form-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .form-header p { font-size: 13px; opacity: 0.9; }
        form { padding: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        label { font-size: 13px; font-weight: 500; color: var(--text-color); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        label i { color: var(--primary-color); }
        input, select { width: 100%; padding: 10px 14px; font-size: 13px; border: 1px solid var(--border-color); border-radius: 8px; outline: none; background-color: #fff; transition: all 0.3s ease; }
        input:focus, select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--focus-ring); }

        .action-buttons-group { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; margin-top: 5px; gap: 10px; }
        .left-actions { display: flex; gap: 10px; }
        
        .btn-action { padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; transition: background-color 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; color: white; }
        .btn-submit { background-color: var(--success-color); }
        .btn-submit:hover { background-color: var(--success-hover); }
        .btn-update { background-color: var(--update-color); display: none; } 
        .btn-update:hover { background-color: var(--update-hover); }
        .btn-delete { background-color: var(--delete-color); display: none; } 
        .btn-delete:hover { background-color: var(--delete-hover); }

        .spinner { display: none; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #alert-box { display: none; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; text-align: center; grid-column: span 2; }
        .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-header">
            <h2>បញ្ជីឈ្មោះសិស្ស (ខេត្តកំពង់ចាម)</h2>
            <p>សូមបញ្ចូល ឬជ្រើសរើសព័ត៌មានសិស្សសម្រាប់កែប្រែខាងក្រោម</p>
        </div>

        <form id="studentForm" onsubmit="handleFormSubmit(event)">
            <div class="form-grid">
                <div id="alert-box"></div>

                <!-- ជ្រើសរើសសិស្សសម្រាប់កែប្រែ -->
                <div class="form-group full-width">
                    <label for="updateStudentSelect"><i class="fa-solid fa-user-pen"></i> ជ្រើសរើសឈ្មោះសិស្សសម្រាប់កែប្រែ</label>
                    <select id="updateStudentSelect" onchange="onStudentSelectChange()">
                        <option value="">-- បញ្ចូលសិស្សថ្មី (ទម្រង់ទទេ) --</option>
                    </select>
                </div>

                <!-- នាមខ្លួន -->
                <div class="form-group">
                    <label for="firstName"><i class="fa-solid fa-user"></i> នាមខ្លួន</label>
                    <input type="text" id="firstName" name="firstName" placeholder="បញ្ចូលនាមខ្លួន" required>
                </div>

                <!-- គោត្តនាម -->
                <div class="form-group">
                    <label for="lastName"><i class="fa-solid fa-user-tag"></i> គោត្តនាម</label>
                    <input type="text" id="lastName" name="lastName" placeholder="បញ្ចូលគោត្តនាម" required>
                </div>

                <!-- រាជធានី / ខេត្ត -->
                <div class="form-group">
                    <label for="province"><i class="fa-solid fa-earth-asia"></i> រាជធានី / ខេត្ត</label>
                    <select id="province" name="province" onchange="loadDistricts()" required>
                        <option value=""> ជ្រើសរើសរាជធានី / ខេត្ត </option>
                    </select>
                </div>

                <!-- ស្រុក / ក្រុង / ខណ្ឌ -->
                <div class="form-group">
                    <label for="district"><i class="fa-solid fa-city"></i> ស្រុក / ក្រុង / ខណ្ឌ</label>
                    <select id="district" name="district" onchange="loadCommunes()" required>
                        <option value=""> សូមជ្រើសរើសខេត្តមុនសិន </option>
                    </select>
                </div>

                <!-- ឃុំ / សង្កាត់ -->
                <div class="form-group">
                    <label for="commune"><i class="fa-solid fa-map"></i> ឃុំ / សង្កាត់</label>
                    <select id="commune" name="commune" onchange="loadVillages()" required>
                        <option value=""> សូមជ្រើសរើសស្រុក/ខណ្ឌមុនសិន </option>
                    </select>
                </div>

                <!-- ភូមិ -->
                <div class="form-group">
                    <label for="village"><i class="fa-solid fa-map-pin"></i> ភូមិ</label>
                    <select id="village" name="village" required>
                        <option value=""> សូមជ្រើសរើសឃុំ/សង្កាត់មុនសិន </option>
                    </select>
                </div>

                <!-- លេខទូរស័ព្ទ -->
                <div class="form-group">
                    <label for="phone"><i class="fa-solid fa-phone"></i> លេខទូរស័ព្ទ</label>
                    <input type="tel" id="phone" name="phone" placeholder="ឧ. 012345678">
                </div>

                <!-- ប្រព័ន្ធទូរស័ព្ទ -->
                <div class="form-group">
                    <label for="network"><i class="fa-solid fa-network-wired"></i> ប្រព័ន្ធទូរស័ព្ទ</label>
                    <select id="network" name="network">
                        <option value=""> ជ្រើសរើសប្រព័ន្ធ </option>
                        <option value="Cellcard">Cellcard</option>
                        <option value="Smart">Smart</option>
                        <option value="Metfone">Metfone</option>
                        <option value="Seatel">Seatel</option>
                    </select>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons-group">
                    <div class="left-actions">
                        <button type="button" id="updateBtn" class="btn-action btn-update" onclick="handleUpdate()">
                            <i class="fa-solid fa-pen-to-square"></i> កែប្រែ
                        </button>
                        <button type="button" id="deleteBtn" class="btn-action btn-delete" onclick="handleDelete()">
                            <i class="fa-solid fa-trash"></i> លុប
                        </button>
                    </div>
                    <button type="submit" class="btn-action btn-submit" id="submitBtn">
                        <span id="btnText">រក្សាទុក (Save)</span>
                        <div class="spinner" id="loadingSpinner"></div>
                    </button>
                </div>
            </div>
        </form>
    </div>

        function loadDistricts() {
            const province = document.getElementById('province').value;
            const districtSelect = document.getElementById('district');
            const communeSelect = document.getElementById('commune');
            const villageSelect = document.getElementById('village');

            districtSelect.innerHTML = '<option value=""> ជ្រើសរើសស្រុក / ក្រុង / ខណ្ឌ </option>';
            communeSelect.innerHTML = '<option value=""> សូមជ្រើសរើសស្រុក/ខណ្ឌមុនសិន </option>';

            if (province && cambodiaData[province]) {
                for (let dist in cambodiaData[province]) {
                    let option = document.createElement('option');
                    option.value = dist;
                    option.textContent = dist;
                    districtSelect.appendChild(option);
                }
            }
        }

        function loadCommunes() {
            const province = document.getElementById('province').value;
            const district = document.getElementById('district').value;
            const communeSelect = document.getElementById('commune');
            const villageSelect = document.getElementById('village');

            communeSelect.innerHTML = '<option value=""> ជ្រើសរើសឃុំ / សង្កាត់ </option>';
            villageSelect.innerHTML = '<option value=""> សូមជ្រើសរើសឃុំ/សង្កាត់មុនសិន </option>';

            if (province && district && cambodiaData[province][district]) {
                for (let comm in cambodiaData[province][district]) {
                    let option = document.createElement('option');
                    option.value = comm;
                    option.textContent = comm;
                    communeSelect.appendChild(option);
                }
            }
        }

        function loadVillages() {
            const province = document.getElementById('province').value;
            const district = document.getElementById('district').value;
            const commune = document.getElementById('commune').value;
            const villageSelect = document.getElementById('village');

            villageSelect.innerHTML = '<option value=""> ជ្រើសរើសភូមិ </option>';

            if (province && district && commune && cambodiaData[province][district][commune]) {

                villages.forEach(vil => {
                    let option = document.createElement('option');
                    option.value = vil;
                    option.textContent = vil;
                    villageSelect.appendChild(option);

        }

        function loadStudentListDropdown() {
            google.script.run.withSuccessHandler(function(students) {
                const select = document.getElementById('updateStudentSelect');
                select.innerHTML = '<option value="">-- បញ្ចូលសិស្សថ្មី (ទម្រង់ទទេ) --</option>';
                students.forEach(s => {
                    let option = document.createElement('option');
                    option.value = s.id;
                    option.textContent = `[ID: ${s.id}] ${s.firstName} ${s.lastName}`;
                    select.appendChild(option);
                });
            }).getAllStudents();
        }

        function onStudentSelectChange() {
            const studentId = document.getElementById('updateStudentSelect').value;
            const submitBtn = document.getElementById('submitBtn');
            const updateBtn = document.getElementById('updateBtn');
            const deleteBtn = document.getElementById('deleteBtn');

            if (!studentId) {
                document.getElementById('studentForm').reset();
                document.getElementById('province').value = "កំពង់ចាម";
                loadDistricts();
                submitBtn.style.display = "flex";
                updateBtn.style.display = "none";
                deleteBtn.style.display = "none";
                return;
            }

            submitBtn.style.display = "none";
            updateBtn.style.display = "flex";
            deleteBtn.style.display = "flex";

            google.script.run.withSuccessHandler(function(student) {
                if (student) {
                    document.getElementById('firstName').value = student.firstName;
                    document.getElementById('lastName').value = student.lastName;
                    document.getElementById('province').value = student.province;
                    loadDistricts();
                    document.getElementById('district').value = student.district;
                    loadCommunes();
                    document.getElementById('commune').value = student.commune;
                    loadVillages();
                    document.getElementById('village').value = student.village;
                    document.getElementById('phone').value = student.phone;
                    document.getElementById('network').value = student.network;
                }
            }).getStudentById(studentId);
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            setLoading(true, "กำลังบันทึก...");

            const data = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                province: document.getElementById('province').value,
                district: document.getElementById('district').value,
                commune: document.getElementById('commune').value,
                village: document.getElementById('village').value,
                phone: document.getElementById('phone').value,
                network: document.getElementById('network').value
            };

            google.script.run
                .withSuccessHandler(function(response) {
                    setLoading(false);
                    showAlert("បានរក្សាទុកដោយជោគជ័យ!", "success");
                    document.getElementById('studentForm').reset();
                    document.getElementById('province').value = "កំពង់ចាម";
                    loadDistricts();
                    loadStudentListDropdown();
                })
                .withFailureHandler(function(error) {
                    setLoading(false);
                    showAlert("កំហុស: " + error.message, "error");
                })
                .saveStudent(data);
        }

        function handleUpdate() {
            const studentId = document.getElementById('updateStudentSelect').value;
            if (!studentId) return;

            setLoading(true, "กำลังอัปเดต...");

            const data = {
                id: studentId,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                province: document.getElementById('province').value,
                district: document.getElementById('district').value,
                commune: document.getElementById('commune').value,
                village: document.getElementById('village').value,
                phone: document.getElementById('phone').value,
                network: document.getElementById('network').value
            };

            google.script.run
                .withSuccessHandler(function(response) {
                    setLoading(false);
                    showAlert("បានកែប្រែទិន្នន័យដោយជោគជ័យ!", "success");
                    loadStudentListDropdown();
                })
                .withFailureHandler(function(error) {
                    setLoading(false);
                    showAlert("កំហុស: " + error.message, "error");
                })
                .updateStudent(data);
        }

        function handleDelete() {
            const studentId = document.getElementById('updateStudentSelect').value;
            if (!studentId) return;

            if (!confirm("តើអ្នកពិតជាចង់លុបទិន្នន័យសិស្សនេះមែនទេ?")) return;

            setLoading(true, "กำลังลบ...");

            google.script.run
                .withSuccessHandler(function(response) {
                    setLoading(false);
                    showAlert("បានលុបដោយជោគជ័យ!", "success");
                    document.getElementById('studentForm').reset();
                    document.getElementById('province').value = "កំពង់ចាម";
                    loadDistricts();
                    loadStudentListDropdown();
                    onStudentSelectChange();
                })
                .withFailureHandler(function(error) {
                    setLoading(false);
                    showAlert("កំហុស: " + error.message, "error");
                })
                .deleteStudent(studentId);
        }

        function setLoading(isLoading, text = "រក្សាទុក (Save)") {
            const submitBtn = document.getElementById('submitBtn');
            const updateBtn = document.getElementById('updateBtn');
            const deleteBtn = document.getElementById('deleteBtn');
            const spinner = document.getElementById('loadingSpinner');
            const btnText = document.getElementById('btnText');

            if (isLoading) {
                submitBtn.disabled = true;
                updateBtn.disabled = true;
                deleteBtn.disabled = true;
                spinner.style.display = "block";
                btnText.style.opacity = "0.7";
            } else {
                submitBtn.disabled = false;
                updateBtn.disabled = false;
                deleteBtn.disabled = false;
                spinner.style.display = "none";
                btnText.style.opacity = "1";
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = message;
            alertBox.className = type === 'success' ? 'alert-success' : 'alert-error';
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
